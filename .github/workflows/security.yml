# Seguridad en cada PR (D1-A-03, security §8.1): Semgrep, OSV-Scanner, gitleaks y CodeQL (este solo con repo público). Bloqueantes.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 5 * * 1'

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.179.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: semgrep scan --error --metrics=off --config p/typescript --config p/nodejs --config .semgrep/

  # CodeQL sube a code scanning, que en repos privados exige GitHub Advanced Security (ADR-016/ADR-023):
  # se activa solo cuando el repo es público. Mientras, Semgrep + OSV + gitleaks son las puertas bloqueantes.
  codeql:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  # OSV-Scanner directo (sin subir SARIF, que exige Advanced Security en privado). Excepciones: osv-scanner.toml.
  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # La imagen no trae shell: se ejecuta con docker run en vez de como contenedor del job.
      - run: docker run --rm -v "$PWD":/src -w /src ghcr.io/google/osv-scanner:v2.6.0 scan source --config=osv-scanner.toml --lockfile=pnpm-lock.yaml

  gitleaks:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gitleaks/gitleaks:v8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: gitleaks git --redact --verbose --exit-code 1 .
