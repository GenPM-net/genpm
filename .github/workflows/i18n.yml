# QA de traducciones (i18n §6) en cada PR que toca catálogos; el bot completa claves con el label `translate`.
name: i18n

on:
  pull_request:
    paths: ['packages/i18n/**', 'apps/web/src/**', 'packages/cli/src/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node packages/i18n/scripts/check.mjs
      - run: node packages/i18n/scripts/lint-literals.mjs
      - run: node packages/i18n/scripts/translate.mjs --dry-run

  translate:
    if: contains(github.event.pull_request.labels.*.name, 'translate')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node packages/i18n/scripts/translate.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: node packages/i18n/scripts/check.mjs
      - run: |
          git config user.name "genpm-translator[bot]"
          git config user.email "bot@genpm.net"
          git add packages/i18n/locales
          git diff --cached --quiet || git commit -m "chore(i18n): machine translations"
          git push
