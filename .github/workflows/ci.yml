# CI de GenPM (D1-A-02). Matriz 3 SO × Node 20/22. Actions fijadas por SHA (security §6).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Las herramientas de build (tsdown, Astro 7) necesitan Node 22; lo publicado (bundle node20.11) se prueba con
      # la versión de la matriz.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm test
        env:
          GENPM_TELEMETRY: '0'
      - run: pnpm --filter @genpm-net/cli cold-start

  # examples/genpm-example-saas: proyecto real hecho con genpm (sus módulos src/lib/* vienen de las semillas @core/*).
  # Comprueba que compila y pasa sus tests, y que su genpm.lock coincide con el registry de producción.
  example:
    name: example (genpm-example-saas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/genpm-example-saas
    env:
      GENPM_TELEMETRY: '0'
      NO_COLOR: '1'
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # Si falla, el diff muestra las firmas `sg` correctas del registry de producción.
      - run: node scripts/relock-signatures.mjs && git diff --exit-code genpm.lock
      - run: npx -y @genpm-net/cli audit
      - run: npx -y @genpm-net/cli list
