# gitleaks (security §6): reglas por defecto + excepciones por ruta. Los tests del escáner usan a propósito claves
# falsas con formato real (p. ej. AKIA… de la documentación de AWS) para comprobar que GenPM las detecta.
title = "genpm"

[extend]
useDefault = true

[[allowlists]]
description = "Fixtures de test y artefactos de build"
paths = [
  '''(^|/)test/''',
  '''\.test\.tsx?$''',
  '''(^|/)apps/registry/seeds/fixtures\.sql$''',
  '''(^|/)dist/''',
]

# Valores públicos por diseño en la config de despliegue: la clave de proyecto de PostHog (phc_…) va al navegador y
# la de IndexNow se publica en https://genpm.net/<clave>.txt. Solo esas dos variables y solo en wrangler.jsonc.
[[allowlists]]
description = "Claves públicas de PostHog e IndexNow en wrangler.jsonc"
paths = ['''(^|/)wrangler\.jsonc$''']
regexTarget = "line"
regexes = ['''"(POSTHOG_KEY|INDEXNOW_KEY)"\s*:\s*"[^"]*"''']
condition = "AND"
